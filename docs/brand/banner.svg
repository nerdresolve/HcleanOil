<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="HCLEAN: equipment for environmental emergency response">
  <title>HCLEAN: equipment for environmental emergency response</title>

  <!--
    The mark comes from the site's official component
    (src/components/ui/Logo.tsx): a disc with two waves, the petrol blue behind
    and the mint green in front, separated by a white thread, inside a ring.
    The paths and the gradients are the same, only rescaled. Do not redraw it:
    any approximation distorts the client's brand.
  -->

  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061a11"/>
      <stop offset="55%" stop-color="#0e3d27"/>
      <stop offset="100%" stop-color="#175034"/>
    </linearGradient>

    <!-- Front wave: mint green fading down into emerald. -->
    <linearGradient id="onda-frente" x1="0" y1="0.2" x2="1" y2="0.9">
      <stop offset="0" stop-color="#7FD9AE"/>
      <stop offset="0.45" stop-color="#42B383"/>
      <stop offset="1" stop-color="#2C8F63"/>
    </linearGradient>

    <!-- Back wave: deep green turning into petrol blue. -->
    <linearGradient id="onda-tras" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7D52"/>
      <stop offset="0.5" stop-color="#2C7FA8"/>
      <stop offset="1" stop-color="#4FA3CE"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="55%" stop-color="#00bf63" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00bf63" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vinheta" cx="0.5" cy="0.42" r="0.78">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>

    <clipPath id="disco"><circle cx="100" cy="100" r="82"/></clipPath>
    <clipPath id="moldura"><rect width="1280" height="400" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#moldura)">
    <rect width="1280" height="400" fill="url(#fundo)"/>

    <!-- Containment boom: the curve that defines the company's product. -->
    <g fill="none" opacity="0.45">
      <path d="M-40 300 C 220 258, 470 332, 720 288 S 1120 232, 1330 276"
            stroke="#00bf63" stroke-opacity="0.24" stroke-width="2.5"/>
      <path d="M-40 330 C 240 288, 500 358, 750 314 S 1140 262, 1330 304"
            stroke="#6fd9a3" stroke-opacity="0.14" stroke-width="2"/>
    </g>
    <g fill="#00bf63" opacity="0.28">
      <circle cx="180" cy="286" r="4"/><circle cx="420" cy="308" r="4"/>
      <circle cx="660" cy="298" r="4"/><circle cx="900" cy="262" r="4"/>
      <circle cx="1140" cy="258" r="4"/>
    </g>

    <rect width="1280" height="400" fill="url(#vinheta)"/>

    <!-- ================================================== brand, front and center -->
    <!-- Halo that lifts the symbol off the dark background. -->
    <circle cx="248" cy="168" r="150" fill="url(#halo)"/>

    <!-- Official symbol: the component's 200x200, scaled up to 224px. -->
    <g transform="translate(136 56) scale(1.12)">
      <circle cx="100" cy="100" r="87" fill="none" stroke="rgba(247,247,247,.95)" stroke-width="8"/>
      <g clip-path="url(#disco)">
        <path d="M10 126 C46 92, 86 92, 122 116 C148 133, 170 136, 192 122 L192 200 L10 200 Z"
              fill="url(#onda-tras)"/>
        <path d="M10 140 C46 106, 86 106, 122 130 C148 147, 170 150, 192 136
                 L192 149 C170 163, 148 160, 122 143 C86 119, 46 119, 10 153 Z"
              fill="rgba(255,255,255,.95)"/>
        <path d="M10 154 C46 120, 86 120, 122 144 C148 161, 170 164, 192 150 L192 200 L10 200 Z"
              fill="url(#onda-frente)"/>
      </g>
    </g>

    <!-- Wordmark: weight 600 and 0.11em tracking, as in the site's lockup. -->
    <text x="412" y="186"
          font-family="'Exo 2', 'Helvetica Neue', Arial, sans-serif"
          font-size="104" font-weight="600" fill="#F4F8F6" letter-spacing="11.4">HCLEAN</text>

    <text x="416" y="236"
          font-family="'Exo 2', 'Helvetica Neue', Arial, sans-serif"
          font-size="25" font-weight="500" fill="#6fd9a3" letter-spacing="0.4">
      Equipment for environmental emergency response
    </text>

    <text x="416" y="272"
          font-family="'Exo 2', 'Helvetica Neue', Arial, sans-serif"
          font-size="17" font-weight="400" fill="#d8f2e4" fill-opacity="0.7">
      Institutional site, quote pop-up and a commercial PDF proposal generated on the spot
    </text>

    <g font-family="'Exo 2', 'Helvetica Neue', Arial, sans-serif" font-size="13"
       font-weight="600" letter-spacing="1.3">
      <g fill="#00bf63" fill-opacity="0.88">
        <text x="416" y="324">NEXT.JS 16</text>
        <text x="546" y="324">TYPESCRIPT</text>
        <text x="686" y="324">EXPRESS</text>
        <text x="796" y="324">PLAYWRIGHT</text>
        <text x="936" y="324">DOCKER</text>
      </g>
      <g fill="#43775e">
        <text x="527" y="324">·</text><text x="667" y="324">·</text>
        <text x="777" y="324">·</text><text x="917" y="324">·</text>
      </g>
    </g>

    <rect x="0" y="0" width="1280" height="3" fill="#00bf63" opacity="0.85"/>
  </g>
</svg>
